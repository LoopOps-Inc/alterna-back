version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: altm_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: altm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: altm_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  web:
    build: .
    container_name: altm_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:password123@db:5432/altm_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=supersecretjwtkeyforaltmdevelopment123!
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
